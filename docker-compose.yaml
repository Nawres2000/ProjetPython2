version: "3.9"

services:

  fastapi:
    build: ./FastApi
    container_name: fastapi_app
    ports:
      - "8000:8000"
    volumes:
      - ./FastApi:/app
      - ./data:/data  
    environment:
      - MONGODB_URI=mongodb+srv://dbuser:rayenQ340@cluster0.9fh3r6f.mongodb.net/?appName=Cluster0
      - JWT_SECRET=change-this-to-a-long-random-secret-in-production
    networks:
      - app_network

  recommender:
    build:
      context: ./job_recommendation
      dockerfile: Dockerfile
    container_name: recommender_app
    ports:
      - "8001:8001"
    volumes:
      - ./job_recommendation/recommender:/app
      - ./job_recommendation/job_scrapper:/job_scrapper
    networks:
      - app_network

  frontend:
    build: ./frontend
    container_name: frontend_app
    ports:
      - "3000:80"
    depends_on:
      - fastapi
      - recommender
    networks:
      - app_network

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_server
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --host 0.0.0.0
      --port 5000
    networks:
      - app_network

networks:
  app_network:
    driver: bridge