version: "3.9"

services:

  fastapi:
    build: ./FastApi
    container_name: fastapi_app
    ports:
      - "8000:8000"
    volumes:
      - ./FastApi:/app
      - ./data:/data  
    networks:
      - app_network

  frontend:
    build: ./frontend
    container_name: frontend_app
    ports:
      - "3000:80"
    depends_on:
      - fastapi
    networks:
      - app_network

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_server
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --host 0.0.0.0
      --port 5000
    networks:
      - app_network

networks:
  app_network:
    driver: bridge